<div class="titre section">Liste des voyages disponible :</div>
<div class="liste_card">
  @for (card of listeVoyage ; track card.id){
    <app-voyagecard [description]="card.description"
                    [destination]="card.destination"
                    [prix]="card.prix"
                    [id]="card.id"
                    (suprimmer)="suprimmerElement($event)">
    </app-voyagecard>
  }
</div>

<div class="pagination">
  <button (click)="previousPage()" [disabled]="currentPage === 0">Précédent</button>
  <span>Page {{ currentPage + 1 }} sur {{ totalPages }}</span>
  <button (click)="nextPage()" [disabled]="currentPage === totalPages - 1">Suivant</button>
</div>
